name: Validate RUMO ENEM v1
on:
  push:
    branches: [rumo-enem-v1, rumo-enem-v1-hardening-20260915, rumo-enem-v2-visual, rumo-enem-v3-typography-account]
  pull_request:
    branches: [master]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app/enem-core-v1.js
          node --check app/enem-visual-v2.js
          node --check app/rumo-shell-v3.js
          node --check app/account-ux-v4.js
          node --check app/account-recovery-v5.js
          node --check app/enem-practice-v1.js
          node --check app/enem-essay-v1.js
          node --check app/enem-mock-v1.js
          node --check app/bootstrap.js
          node --check sw.js
      - name: Check ENEM security and product contracts
        run: |
          grep -q "RELEASE='10-enem-v5'" app/bootstrap.js
          grep -q "rumo-polish-v4.css" app/bootstrap.js
          grep -q "rumo-type-system-v6.css" app/bootstrap.js
          grep -q "rumo-account-v5.css" app/bootstrap.js
          ! grep -q "addCss('./rumo-readability-v4b.css')" app/bootstrap.js
          ! grep -q "addCss('./rumo-study-readability-v5.css')" app/bootstrap.js
          grep -q "account-ux-v4.js" app/bootstrap.js
          grep -q "account-recovery-v5.js" app/bootstrap.js
          grep -q "enem-core-v1.js" app/bootstrap.js
          grep -q "enem-practice-v1.js" app/bootstrap.js
          grep -q "enem-essay-v1.js" app/bootstrap.js
          grep -q "enem-mock-v1.js" app/bootstrap.js
          grep -q "functions.invoke('check-enem-answer'" app/enem-practice-v1.js
          grep -q "functions.invoke('check-enem-answer'" app/enem-mock-v1.js
          ! grep -q "rumo_check_answer" app/enem-practice-v1.js app/enem-mock-v1.js
          grep -q "SUPABASE_SERVICE_ROLE_KEY" supabase/functions/check-enem-answer/index.ts
          grep -q "body_too_large" supabase/functions/check-enem-answer/index.ts
          grep -q "CACHE_NAME=.*v9" sw.js
          grep -q "rumo-type-system-v6.css" sw.js
          grep -q "rumo-account-v5.css" sw.js
          grep -q "account-recovery-v5.js" sw.js
          ! grep -q "rumo-readability-v4b.css" sw.js
          ! grep -q "rumo-study-readability-v5.css" sw.js
          grep -q "PASSWORD_RECOVERY" app/account-recovery-v5.js
          grep -q "updateUser({password})" app/account-recovery-v5.js
          grep -q "rumoIconSystem='iconoir'" app/enem-visual-v2.js
          grep -q "rumoShell='nexo-v3'" app/rumo-shell-v3.js
          grep -q "eden-mark-v3" rumo-shell-v3.css app/rumo-shell-v3.js
          grep -q "20260916021000_enem_covering_indexes_v1" docs/ACTIVE-SURFACE.md || true
          test -f supabase/migrations/20260916021000_enem_covering_indexes_v1.sql
          test -f supabase/migrations/20260916021200_enem_content_integrity_v1.sql

  browser-smoke:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --save-exact playwright@1.62.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit every tab, ENEM content and account recovery
        run: |
          python3 -m http.server 4173 >/tmp/rumo-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const viewports=[{width:1440,height:900},{width:1366,height:768},{width:390,height:844},{width:360,height:800}];
            const tabs=['hoje','enem','questoes','redacao','simulados','concursos','revisoes'];
            for(const viewport of viewports){
              const page=await browser.newPage({viewport});
              await page.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.documentElement.dataset.rumoBoot==='ready',{timeout:20000});
              await page.waitForSelector('[data-tab="enem"]',{timeout:10000});
              const visual=await page.evaluate(()=>({icons:document.body.dataset.rumoIconSystem,shell:document.body.dataset.rumoShell,version:document.documentElement.dataset.rumoVersion}));
              if(visual.icons!=='iconoir'||visual.shell!=='nexo-v3'||visual.version!=='10-enem-v5')throw new Error(`wrong visual system: ${JSON.stringify(visual)}`);
              const styles=await page.evaluate(()=>[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.getAttribute('href')||''));
              if(styles.some(x=>x.includes('rumo-readability-v4b')||x.includes('rumo-study-readability-v5')))throw new Error(`obsolete typography layer loaded: ${styles}`);
              const go=async id=>{
                if(viewport.width<=780){const open=await page.locator('.sidebar').evaluate(el=>el.classList.contains('open'));if(!open){await page.locator('#menu').click();await page.waitForFunction(()=>document.querySelector('.sidebar')?.classList.contains('open'))}}
                await page.locator(`[data-tab="${id}"]`).click();
                await page.waitForFunction(id=>document.querySelector(`#${id}`)?.classList.contains('active'),id);
              };
              for(const id of tabs){
                await go(id);await page.waitForTimeout(60);
                const audit=await page.evaluate(id=>{const root=document.querySelector(`#${id}`),h=root.querySelector('h1');return{overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,h:h?parseFloat(getComputedStyle(h).fontSize):0}},id);
                if(audit.overflow)throw new Error(`overflow ${id} ${viewport.width}`);
                if(viewport.width>780&&audit.h&&(audit.h<32||audit.h>40.5))throw new Error(`heading out of scale ${id}: ${audit.h}`);
              }
              await go('enem');
              await page.waitForFunction(()=>window.RUMO_ENEM?.data?.questionCount>=32,{timeout:15000});
              const content=await page.evaluate(()=>({questions:window.RUMO_ENEM.data.questionCount,essays:window.RUMO_ENEM.data.essayTopics?.length||0}));
              if(content.questions<32||content.essays<8)throw new Error(`starter content incomplete: ${JSON.stringify(content)}`);
              await go('questoes');
              await page.waitForSelector('[data-enem-answer]',{timeout:15000});
              if(viewport.width>780){const optionSize=await page.locator('[data-enem-answer] span').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize));if(optionSize<15)throw new Error(`question option too small: ${optionSize}`)}
              await page.locator('[data-enem-answer]').first().click();
              await page.waitForSelector('.rumo-feedback.success, .rumo-feedback.failure',{timeout:15000});
              await go('redacao');
              await page.waitForSelector('#enem-essay-text');
              if(viewport.width>780){const sizes=await page.evaluate(()=>({theme:parseFloat(getComputedStyle(document.querySelector('#redacao .rumo-essay-list button b')).fontSize),meta:parseFloat(getComputedStyle(document.querySelector('#redacao .rumo-essay-list button span')).fontSize),footer:parseFloat(getComputedStyle(document.querySelector('#redacao .rumo-editor-foot')).fontSize),competence:parseFloat(getComputedStyle(document.querySelector('#redacao .rumo-competencies span')).fontSize),editor:parseFloat(getComputedStyle(document.querySelector('#enem-essay-text')).fontSize)}));if(sizes.theme<15||sizes.meta<13||sizes.footer<13||sizes.competence<13||sizes.editor<16)throw new Error(`essay type too small: ${JSON.stringify(sizes)}`)}
              await page.evaluate(()=>window.RUMO_ACCOUNT_RECOVERY?.open());
              await page.waitForSelector('#password-recovery-v5.open');
              const recovery=await page.evaluate(()=>({min:document.querySelector('#password-new-v5')?.minLength,confirm:document.querySelector('#password-confirm-v5')?.minLength,auto:document.querySelector('#password-new-v5')?.autocomplete}));
              if(recovery.min<8||recovery.confirm<8||recovery.auto!=='new-password')throw new Error(`recovery UI invalid: ${JSON.stringify(recovery)}`);
              await page.close();
            }
            await browser.close();
            console.log('RUMO ENEM v5 full smoke ok');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
