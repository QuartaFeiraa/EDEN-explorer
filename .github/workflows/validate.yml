name: Validate RUMO
on:
  push:
    branches: [master, rumo-v9-product-hardening]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          for f in app/*.js; do echo "checking $f"; node --check "$f"; done
          if [ -d api ]; then find api -name '*.js' -type f -print0 | xargs -0 -n1 node --check; fi
      - name: Check stable architecture
        run: |
          grep -q "RELEASE='9-stable'" app/bootstrap.js
          grep -q "radar-v2.js" app/bootstrap.js
          grep -q "courses-v2.js" app/bootstrap.js
          grep -q "history-v1.js" app/bootstrap.js
          grep -q "product-v1.js" app/bootstrap.js
          grep -q "data-rights-v1.js" app/bootstrap.js
          grep -q "product-v1.css" app/bootstrap.js
          grep -q "styles.css?v=9-stable" index.html
          grep -q "script.js?v=9-stable" index.html
          grep -q "bootstrap.js?v=9-stable" index.html
          ! grep -q "app/radar.js" app/bootstrap.js
          ! grep -q "app/courses.js" app/bootstrap.js
          ! grep -q "MutationObserver" app/radar-v2.js
          ! grep -q "MutationObserver" app/courses-v2.js
          grep -q "contest_watchlist" app/radar-v2.js
          grep -q "done_lessons" app/courses-v2.js
          grep -q "sessoes_estudo" app/history-v1.js
          echo "RUMO v9 stable architecture OK"
      - name: Check security invariants
        run: |
          grep -q "SUPABASE_JS_VERSION='2.112.4'" script.js
          grep -q "ALLOWED_CONTEST_STATUS" script.js
          grep -q "escapeHTML" script.js
          grep -q "safeJSON" script.js
          ! grep -RE "sb_secret_|SUPABASE_SERVICE_ROLE_KEY|service_role" script.js app/*.js ./*.html
          grep -q "SUPABASE_SECRET_KEY" api/_lib/supabase.js
          grep -q "startsWith('sb_secret_')" api/_lib/supabase.js
          grep -q "active_subscription" api/delete-account.js
          grep -q "body.confirm!=='EXCLUIR'" api/delete-account.js
          grep -q "safeStatus" app/radar-v2.js
          grep -q "url.protocol==='https:'" app/radar-v2.js
          grep -q '"X-Content-Type-Options"' vercel.json
          grep -q '"X-Frame-Options"' vercel.json
          grep -q '"Referrer-Policy"' vercel.json
          echo "RUMO security invariants OK"
      - name: Check deletion endpoint fails closed
        run: |
          node <<'NODE'
          const handler=require('./api/delete-account');
          function res(){return {code:0,headers:{},body:'',status(n){this.code=n;return this},setHeader(k,v){this.headers[k]=v},end(v){this.body=v||''}}}
          (async()=>{
            let r=res();await handler({method:'GET',headers:{},body:{}},r);if(r.code!==405)throw new Error(`GET expected 405, got ${r.code}`);
            r=res();await handler({method:'POST',headers:{},body:{}},r);if(r.code!==400)throw new Error(`missing confirmation expected 400, got ${r.code}`);
            r=res();await handler({method:'POST',headers:{},body:{confirm:'EXCLUIR'}},r);if(r.code!==401)throw new Error(`missing auth expected 401, got ${r.code}`);
            console.log('delete-account fail-closed contract OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
  browser-smoke:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --save-exact playwright@1.62.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact commit locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rumo-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/rumo-server.log
          exit 1
      - name: Test stable product in Chromium
        run: |
          timeout 120s node <<'NODE'
          const { chromium } = require('playwright');
          const APP='http://127.0.0.1:4173/';
          const SUPABASE='https://zycpeiyztqysjqejtour.supabase.co';
          const log=m=>console.log('[smoke]',m);
          async function waitReady(page,label){
            await page.waitForFunction(()=>document.documentElement.dataset.rumoVersion==='9-stable',null,{timeout:15000});
            const state=await page.evaluate(()=>({boot:document.documentElement.dataset.rumoBoot,font:getComputedStyle(document.body).fontFamily,w:document.documentElement.scrollWidth,v:innerWidth}));
            if(state.boot!=='ready')throw new Error(`${label}: boot ${state.boot}`);
            if(!/Inter/i.test(state.font))throw new Error(`${label}: fonte ${state.font}`);
            if(state.w>state.v+2)throw new Error(`${label}: overflow ${state.w}/${state.v}`);
          }
          async function desktopFlow(page,label){
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const t=Date.now();await page.goto(APP,{waitUntil:'domcontentloaded',timeout:20000});await waitReady(page,label);
            await page.waitForTimeout(3500);
            await page.click('[data-tab="concursos"]',{timeout:3000});
            await page.waitForSelector('#concursos.page.active');
            await page.waitForFunction(()=>document.querySelectorAll('#all-contests .contest').length>=3,null,{timeout:8000});
            await page.click('#all-contests .contest .contest-more',{timeout:3000});
            await page.waitForSelector('#contest-detail-modal.open',{timeout:3000});
            await page.click('#contest-detail-close');
            await page.click('[data-tab="essenciais"]',{timeout:3000});
            await page.waitForFunction(()=>window.RUMO_COURSES&&document.querySelectorAll('#course-grid .course').length>=6,null,{timeout:8000});
            await page.waitForTimeout(3200);
            await page.click('#course-grid [data-course="informatica"]',{timeout:3000});
            await page.waitForSelector('#course-modal.open .lesson-content',{timeout:3000});
            await page.click('#close-course');
            await page.click('[data-tab="hoje"]',{timeout:3000});
            await page.click('#theme-toggle',{timeout:3000});await page.click('#theme-toggle',{timeout:3000});
            await page.waitForSelector('#history-open-v1',{timeout:5000});await page.click('#history-open-v1');await page.waitForSelector('#history-v1.open');await page.click('#history-close-v1');
            await page.waitForFunction(()=>!!window.RUMO_DATA_RIGHTS,null,{timeout:5000});
            if(errors.length)throw new Error(`${label}: JS ${errors.join(' | ')}`);
            return Date.now()-t;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cleanCtx=await browser.newContext({viewport:{width:1920,height:1080}});const clean=await cleanCtx.newPage();log(`clean ${await desktopFlow(clean,'clean')}ms`);await cleanCtx.close();

            const persistedCtx=await browser.newContext({viewport:{width:1920,height:1080}});
            await persistedCtx.addInitScript(()=>{localStorage.setItem('rumo-theme','dark');localStorage.setItem('rumo-lessons-v2',JSON.stringify({informatica:{done:[0,1],last:2}}));localStorage.setItem('rumo-guest-goal',JSON.stringify({objective_name:'SEFAZ DF 2026',cargo:'Auditor',weekly_hours:10,study_days:[1,2,3,4,5],level:'intermediario'}));sessionStorage.setItem('rumo-onboarding-shown','1')});
            const persisted=await persistedCtx.newPage();log(`persisted ${await desktopFlow(persisted,'persisted')}ms`);await persistedCtx.close();

            const corruptCtx=await browser.newContext({viewport:{width:1280,height:800}});
            await corruptCtx.addInitScript(()=>localStorage.setItem('rumo-course-state','{corrompido'));
            const corrupt=await corruptCtx.newPage();await corrupt.goto(APP,{waitUntil:'domcontentloaded',timeout:20000});await waitReady(corrupt,'corrupt-storage');log('corrupt localStorage tolerated');await corruptCtx.close();

            const degradedCtx=await browser.newContext({viewport:{width:1920,height:1080}});await degradedCtx.route(`${SUPABASE}/**`,r=>r.abort());const degraded=await degradedCtx.newPage();await degraded.goto(APP,{waitUntil:'domcontentloaded',timeout:20000});await degraded.click('[data-tab="concursos"]',{timeout:3000});await degraded.waitForSelector('#concursos.page.active');await degraded.waitForTimeout(4500);await degraded.click('[data-tab="hoje"]',{timeout:3000});await degraded.click('#theme-toggle',{timeout:3000});log('degraded interactive');await degradedCtx.close();

            const xssCtx=await browser.newContext({viewport:{width:1280,height:800}});
            await xssCtx.route(`${SUPABASE}/rest/v1/concursos**`,route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify([
              {id:901,nome:'<img id="rumo-xss" src=x onerror="window.__rumoXss=1">',orgao:'<script>window.__rumoXss=2</script>',area:'Fiscal',status:'banca_definida injected-class',banca:'<b>malicioso</b>',vagas:'10',remuneracao:'R$ 1',uf:'DF',fonte_url:'javascript:window.__rumoXss=3'},
              {id:902,nome:'Seguro 2',orgao:'Órgão',area:'Fiscal',status:'previsto',banca:'Banca',vagas:'2',remuneracao:'R$ 2',uf:'SP'},
              {id:903,nome:'Seguro 3',orgao:'Órgão',area:'Fiscal',status:'previsto',banca:'Banca',vagas:'3',remuneracao:'R$ 3',uf:'RJ'}
            ])}));
            const xssPage=await xssCtx.newPage();xssPage.on('pageerror',e=>{throw e});await xssPage.goto(APP,{waitUntil:'domcontentloaded',timeout:20000});await waitReady(xssPage,'xss');await xssPage.click('[data-tab="concursos"]',{timeout:3000});await xssPage.waitForSelector('#concursos.page.active');await xssPage.waitForFunction(()=>document.querySelectorAll('#all-contests .contest').length===3,null,{timeout:8000});await xssPage.waitForSelector('#all-contests .contest .contest-more',{timeout:5000});
            const safety=await xssPage.evaluate(()=>({executed:window.__rumoXss||0,node:!!document.querySelector('#rumo-xss'),text:document.querySelector('#all-contests .contest h3')?.textContent||'',badge:document.querySelector('#all-contests .contest .status')?.className||''}));
            if(safety.executed||safety.node||!safety.text.includes('<img')||safety.badge.includes('injected-class'))throw new Error(`xss protection failed ${JSON.stringify(safety)}`);
            await xssPage.click('#all-contests .contest .contest-more');await xssPage.waitForSelector('#contest-detail-modal.open');if(await xssPage.locator('#contest-source-btn').count())throw new Error('unsafe source protocol rendered');
            log('database HTML, status and source URL protected');await xssCtx.close();

            const mobileCtx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});const mobile=await mobileCtx.newPage();await mobile.goto(APP,{waitUntil:'domcontentloaded',timeout:20000});await waitReady(mobile,'mobile');await mobile.waitForTimeout(2500);await mobile.click('#menu',{timeout:3000});await mobile.waitForSelector('.sidebar.open');await mobile.click('[data-tab="concursos"]',{timeout:3000});const m=await mobile.evaluate(()=>({w:document.documentElement.scrollWidth,v:innerWidth}));if(m.w>m.v+2)throw new Error(`mobile overflow ${m.w}/${m.v}`);log('mobile interactive');await mobileCtx.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
