name: Validate RUMO
on:
  push:
    branches: [master]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check app-v2.js
          node --check radar-v3.js
          for f in app/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Check live boot architecture
        run: |
          grep -q "core-v2.js" app/bootstrap.js
          grep -q "engine-v2.js" app/bootstrap.js
          grep -q "7-live" app/bootstrap.js
          grep -q "styles.css?v=7-live" index.html
          grep -q "script.js?v=7-live" index.html
          grep -q "bootstrap.js?v=7-live" index.html
          grep -q "RUMO_SDK_READY" script.js
          grep -q "RUMO_CONTESTS_READY" script.js
          grep -q "setTimeout(()=>{sync(true)" app/core-v2.js
          ! grep -q "if(event!=='INITIAL_SESSION')sync(true)" app/core-v2.js
          grep -q "rumoBoot='ready'" app/bootstrap.js
          grep -q "Promise.race" app/bootstrap.js
          test -f app/account.js
          test -f app/core-v2.js
          test -f app/engine-v2.js
          test -f app/radar.js
          echo "Live boot architecture OK"
  browser-smoke:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact commit locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rumo-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/rumo-server.log
          exit 1
      - name: Test clean persisted degraded and mobile states
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const APP_URL='http://127.0.0.1:4173/';
          async function waitBoot(page,label){
            await page.waitForFunction(()=>document.documentElement.dataset.rumoVersion==='7-live',null,{timeout:12000});
            const state=await page.evaluate(()=>({boot:document.documentElement.dataset.rumoBoot||'',font:getComputedStyle(document.body).fontFamily}));
            if(state.boot==='error')throw new Error(`${label}: boot marcou erro`);
            if(!/Inter/i.test(state.font))throw new Error(`${label}: fonte inesperada ${state.font}`);
          }
          async function exercise(page,label,{courses=true}={}){
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const started=Date.now();
            const response=await page.goto(APP_URL,{waitUntil:'domcontentloaded',timeout:20000});
            if(!response||!response.ok())throw new Error(`${label}: HTTP ${response?.status()}`);
            await waitBoot(page,label);
            const bootMs=Date.now()-started;
            await page.waitForSelector('#account-btn',{timeout:5000});
            await page.click('[data-tab="concursos"]',{timeout:5000});
            await page.waitForSelector('#concursos.page.active',{timeout:3000});
            await page.click('[data-tab="revisoes"]',{timeout:5000});
            await page.waitForSelector('#revisoes.page.active',{timeout:3000});
            if(courses){
              await page.click('[data-tab="essenciais"]',{timeout:5000});
              await page.waitForSelector('#essenciais.page.active',{timeout:3000});
              await page.waitForFunction(()=>window.RUMO_COURSES&&document.querySelectorAll('#course-grid .course').length>=6,null,{timeout:10000});
            }
            const snap=await page.evaluate(()=>({width:document.documentElement.scrollWidth,viewport:window.innerWidth,openModals:document.querySelectorAll('.modal.open').length}));
            if(snap.width>snap.viewport+2)throw new Error(`${label}: overflow ${snap.width}/${snap.viewport}`);
            if(errors.length)throw new Error(`${label}: JS ${errors.join(' | ')}`);
            return {bootMs,...snap};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});

            const cleanCtx=await browser.newContext({viewport:{width:1920,height:1080}});
            const clean=await cleanCtx.newPage();
            const cleanSnap=await exercise(clean,'clean');

            const persistedCtx=await browser.newContext({viewport:{width:1920,height:1080}});
            await persistedCtx.addInitScript(()=>{
              localStorage.setItem('rumo-theme','dark');
              localStorage.setItem('rumo-course-state',JSON.stringify({informatica:{progress:40}}));
              localStorage.setItem('rumo-guest-goal',JSON.stringify({id:'guest',active:true,objective_name:'SEFAZ DF 2026',cargo:'Auditor',weekly_hours:10,study_days:[1,2,3,4,5],level:'intermediario'}));
              sessionStorage.setItem('rumo-onboarding-shown','1');
            });
            const persisted=await persistedCtx.newPage();
            const persistedSnap=await exercise(persisted,'persisted');
            await persisted.click('[data-tab="hoje"]',{timeout:5000});
            await persisted.waitForSelector('#hoje.page.active',{timeout:3000});
            await persisted.click('#theme-toggle',{timeout:3000});
            await persisted.click('#theme-toggle',{timeout:3000});

            const degradedCtx=await browser.newContext({viewport:{width:1920,height:1080}});
            await degradedCtx.route('https://zycpeiyztqysjqejtour.supabase.co/**',route=>route.abort());
            const degraded=await degradedCtx.newPage();
            const degradedSnap=await exercise(degraded,'degraded',{courses:false});
            await degraded.click('[data-tab="hoje"]',{timeout:5000});
            await degraded.waitForSelector('#hoje.page.active',{timeout:3000});

            const mobileCtx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const mobile=await mobileCtx.newPage();
            const mobileSnap=await exercise(mobile,'mobile',{courses:false});
            await mobile.click('#menu',{timeout:3000});
            await mobile.waitForSelector('.sidebar.open',{timeout:3000});

            console.log(JSON.stringify({clean:cleanSnap,persisted:persistedSnap,degraded:degradedSnap,mobile:mobileSnap}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
