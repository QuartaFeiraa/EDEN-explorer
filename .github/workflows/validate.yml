name: Validate RUMO
on:
  push:
    branches: [master]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check app-v2.js
          node --check radar-v3.js
          for f in app/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Check fast boot architecture
        run: |
          grep -q "core-v2.js" app/bootstrap.js
          grep -q "engine-v2.js" app/bootstrap.js
          grep -q "RUMO_SDK_READY" script.js
          grep -q "RUMO_CONTESTS_READY" script.js
          ! grep -q "app-v2.js" script.js
          ! grep -q "planner-v1.js" script.js
          ! grep -q "study-tools.js" script.js
          ! grep -q "sync.js" app/bootstrap.js
          ! grep -q "radar-v3.js" app/bootstrap.js
          test -f app/account.js
          test -f app/core-v2.js
          test -f app/engine-v2.js
          test -f app/radar.js
          echo "Fast boot architecture OK"
  browser-smoke:
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test production in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const errors=[];
            page.on('pageerror',e=>errors.push(`page: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))errors.push(`console: ${m.text()}`)});
            const started=Date.now();
            const response=await page.goto('https://orbe-concursos.vercel.app/',{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||!response.ok())throw new Error(`HTTP ${response?.status()}`);
            await page.waitForSelector('[data-tab="concursos"]',{timeout:15000});
            await page.waitForFunction(()=>document.documentElement.dataset.rumoVersion==='4-fast',{timeout:20000});
            const bootMs=Date.now()-started;
            await page.click('[data-tab="concursos"]');
            await page.waitForSelector('#concursos.page.active');
            await page.click('[data-tab="essenciais"]');
            await page.waitForSelector('#essenciais.page.active');
            const snapshot=await page.evaluate(()=>({
              version:document.documentElement.dataset.rumoVersion,
              contests:document.querySelectorAll('#all-contests .contest').length,
              courses:document.querySelectorAll('#course-grid .course').length,
              width:document.documentElement.scrollWidth,
              viewport:window.innerWidth
            }));
            if(snapshot.width>snapshot.viewport+2)throw new Error(`Horizontal overflow ${snapshot.width}/${snapshot.viewport}`);
            if(snapshot.contests<1)throw new Error('Radar sem concursos');
            if(snapshot.courses<6)throw new Error('Essenciais não renderizados');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log(JSON.stringify({bootMs,...snapshot}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
