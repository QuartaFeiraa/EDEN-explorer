name: Validate RUMO
on:
  push:
    branches: [master]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check app-v2.js
          node --check radar-v3.js
          for f in app/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Check live boot architecture
        run: |
          grep -q "core-v2.js" app/bootstrap.js
          grep -q "engine-v2.js" app/bootstrap.js
          grep -q "8-fix" app/bootstrap.js
          grep -q "styles.css?v=8-fix" index.html
          grep -q "script.js?v=8-fix" index.html
          grep -q "bootstrap.js?v=8-fix" index.html
          grep -q "setTimeout(()=>{sync(true)" app/core-v2.js
          ! grep -q "loadCourses().catch" app/bootstrap.js | grep -q "idle"
          grep -q "rumoCourseDecorated" app/courses.js
          test -f app/account.js
          test -f app/core-v2.js
          test -f app/engine-v2.js
          test -f app/radar.js
          echo "RUMO v8 architecture OK"
  browser-smoke:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact commit locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rumo-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/rumo-server.log
          exit 1
      - name: Test interaction after idle, degraded network and mobile
        run: |
          timeout 75s node <<'NODE'
          const { chromium } = require('playwright');
          const URL='http://127.0.0.1:4173/';
          const log=m=>console.log('[smoke]',m);
          async function ready(page,label){
            await page.waitForFunction(()=>document.documentElement.dataset.rumoVersion==='8-fix',null,{timeout:12000});
            const font=await page.evaluate(()=>getComputedStyle(document.body).fontFamily);
            if(!/Inter/i.test(font))throw new Error(`${label}: fonte ${font}`);
          }
          async function normal(page,label){
            const started=Date.now();
            await page.goto(URL,{waitUntil:'domcontentloaded',timeout:20000});
            await ready(page,label);
            await page.click('[data-tab="concursos"]',{timeout:4000});
            await page.waitForSelector('#concursos.page.active');
            await page.click('[data-tab="essenciais"]',{timeout:4000});
            await page.waitForSelector('#essenciais.page.active');
            await page.waitForFunction(()=>window.RUMO_COURSES&&document.querySelectorAll('#course-grid .course').length>=6,null,{timeout:8000});
            // The old bug appeared after the observer had been alive for ~1.6s.
            await page.waitForTimeout(2300);
            await page.click('[data-tab="hoje"]',{timeout:3000});
            await page.waitForSelector('#hoje.page.active');
            await page.click('#theme-toggle',{timeout:3000});
            await page.click('#theme-toggle',{timeout:3000});
            const snap=await page.evaluate(()=>({w:document.documentElement.scrollWidth,v:innerWidth}));
            if(snap.w>snap.v+2)throw new Error(`${label}: overflow`);
            return Date.now()-started;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cleanCtx=await browser.newContext({viewport:{width:1920,height:1080}});
            const clean=await cleanCtx.newPage();
            log(`clean ${await normal(clean,'clean')}ms`);
            await cleanCtx.close();

            const persistedCtx=await browser.newContext({viewport:{width:1920,height:1080}});
            await persistedCtx.addInitScript(()=>{
              localStorage.setItem('rumo-theme','dark');
              localStorage.setItem('rumo-lessons-v1',JSON.stringify({informatica:{done:[0,1]}}));
              localStorage.setItem('rumo-guest-goal',JSON.stringify({objective_name:'SEFAZ DF 2026',cargo:'Auditor',weekly_hours:10,study_days:[1,2,3,4,5]}));
              sessionStorage.setItem('rumo-onboarding-shown','1');
            });
            const persisted=await persistedCtx.newPage();
            log(`persisted ${await normal(persisted,'persisted')}ms`);
            await persistedCtx.close();

            // With Supabase unreachable, the base shell must remain interactive
            // even if the personalized data layer cannot become ready.
            const degradedCtx=await browser.newContext({viewport:{width:1920,height:1080}});
            await degradedCtx.route('https://zycpeiyztqysjqejtour.supabase.co/**',r=>r.abort());
            const degraded=await degradedCtx.newPage();
            await degraded.goto(URL,{waitUntil:'domcontentloaded',timeout:20000});
            await degraded.click('[data-tab="concursos"]',{timeout:3000});
            await degraded.waitForSelector('#concursos.page.active');
            await degraded.waitForTimeout(2500);
            await degraded.click('[data-tab="hoje"]',{timeout:3000});
            await degraded.click('#theme-toggle',{timeout:3000});
            log('degraded interactive');
            await degradedCtx.close();

            const mobileCtx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const mobile=await mobileCtx.newPage();
            await mobile.goto(URL,{waitUntil:'domcontentloaded',timeout:20000});
            await ready(mobile,'mobile');
            await mobile.click('#menu',{timeout:3000});
            await mobile.waitForSelector('.sidebar.open',{timeout:3000});
            const m=await mobile.evaluate(()=>({w:document.documentElement.scrollWidth,v:innerWidth}));
            if(m.w>m.v+2)throw new Error('mobile overflow');
            log('mobile interactive');
            await mobileCtx.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
